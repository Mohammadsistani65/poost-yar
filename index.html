<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پوست‌یار | اسکن هوشمند پوست و مو</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Vazirmatn, sans-serif; }
body { background: linear-gradient(135deg, #f5e6f0 0%, #e8f0f5 100%); min-height: 100vh; padding: 16px; color: #2d2d2d; }
header { text-align: center; padding: 20px 0 10px; }
header h1 { font-size: 28px; color: #6b2e6b; margin-bottom: 6px; }
.subtitle { color: #777; font-size: 14px; }
.tabs { display: flex; gap: 6px; max-width: 480px; margin: 0 auto 16px; background: #fff; padding: 6px; border-radius: 12px; box-shadow: 0 4px 16px rgba(107,46,107,0.08); }
.tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-size: 13px; cursor: pointer; color: #888; transition: all 0.2s; }
.tab.active { background: linear-gradient(135deg, #9b4d9b, #6b2e6b); color: #fff; font-weight: bold; }
main { max-width: 480px; margin: 0 auto; }
.card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(107,46,107,0.08); }
.card h2 { font-size: 18px; color: #6b2e6b; margin-bottom: 16px; border-bottom: 2px solid #f0e0f0; padding-bottom: 8px; }
.card h3 { font-size: 16px; color: #6b2e6b; margin: 20px 0 12px; }
label { display: block; margin-bottom: 14px; font-size: 14px; color: #444; }
input, select { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa; }
button { width: 100%; padding: 12px; background: linear-gradient(135deg, #9b4d9b, #6b2e6b); color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 8px; transition: transform 0.15s; }
button:active { transform: scale(0.98); }
button.secondary { background: #e8e0e8; color: #6b2e6b; }
button.whatsapp { background: #25D366; }
.hidden { display: none; }
.hint { font-size: 13px; color: #888; margin-bottom: 12px; line-height: 1.7; }
.video-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 3/4; }
#video { width: 100%; height: 100%; object-fit: cover; }
.buttons { margin-top: 12px; }
.issue-item { background: #faf0fa; border-right: 4px solid #9b4d9b; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
.issue-item h4 { font-size: 15px; color: #6b2e6b; margin-bottom: 4px; }
.issue-item p { font-size: 13px; color: #666; }
.severity { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-left: 6px; color: #fff; }
.severity.low { background: #7cb342; }
.severity.medium { background: #f9a825; }
.severity.high { background: #e53935; }
.product-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f8f8fa; border-radius: 10px; margin-bottom: 8px; }
.product-item .brand { font-size: 11px; color: #9b4d9b; font-weight: bold; background: #f0e0f0; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.product-item .name { font-size: 13px; color: #333; flex: 1; }
.region-tag { font-size: 11px; color: #6b2e6b; background: #f0e0f0; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
.history-item { background: #f8f8fa; border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
.history-item .date { color: #999; font-size: 11px; }
.history-item .name { color: #6b2e6b; font-weight: bold; margin: 4px 0; }
.history-item .summary { color: #666; font-size: 12px; line-height: 1.6; }
.empty-state { text-align: center; padding: 30px 20px; color: #999; font-size: 14px; }
footer { text-align: center; padding: 24px 0 12px; font-size: 13px; color: #999; }
footer strong { color: #6b2e6b; }
</style>
</head>
<body>

<header>
  <h1>🌿 پوست‌یار</h1>
  <p class="subtitle">اسکن هوشمند پوست و مو | طراح: محمد سیستانی</p>
</header>

<div class="tabs">
  <div class="tab active" data-tab="scan">اسکن</div>
  <div class="tab" data-tab="history">سابقه مشتریان</div>
</div>

<main>
  <!-- بخش اسکن -->
  <div id="tab-scan">
    <section id="form-section" class="card">
      <h2>۱. اطلاعات مشتری</h2>
      <label>نام مشتری (اختیاری):
        <input type="text" id="customer-name" placeholder="مثلاً خانم احمدی">
      </label>
      <label>سن:
        <input type="number" id="age" min="10" max="90" placeholder="مثلاً ۳۰">
      </label>
      <label>نوع پوست (اگر می‌دانید):
        <select id="skin-type">
          <option value="unknown">نمی‌دانم</option>
          <option value="dry">خشک</option>
          <option value="oily">چرب</option>
          <option value="normal">معمولی</option>
          <option value="sensitive">حساس</option>
        </select>
      </label>
      <label>حساسیت پوستی دارید؟
        <select id="sensitivity">
          <option value="no">خیر</option>
          <option value="yes">بله</option>
        </select>
      </label>
      <label>ناحیه‌ی اسکن:
        <select id="scan-area">
          <option value="face">صورت</option>
          <option value="scalp">مو و کف سر</option>
        </select>
      </label>
      <button id="next-to-camera">ادامه به اسکن</button>
    </section>

    <section id="camera-section" class="card hidden">
      <h2>۲. اسکن <span id="scan-area-label">صورت</span></h2>
      <p class="hint" id="camera-hint">صورت خود را در نور مناسب و بدون آرایش مقابل دوربین قرار دهید.</p>
      <div class="video-wrapper">
        <video id="video" autoplay playsinline muted></video>
      </div>
      <div class="buttons">
        <button id="switch-camera" class="secondary">🔃 چرخش دوربین (پشت/جلو)</button>
        <button id="capture">📸 گرفتن عکس و تحلیل</button>
        <button id="retake" class="secondary hidden">🔄 اسکن مجدد</button>
      </div>
    </section>

    <section id="result-section" class="card hidden">
      <h2>۳. نتیجه تحلیل</h2>
      <div id="issues-list"></div>
      <h3>پیشنهاد محصولات</h3>
      <div id="products-list"></div>
      <div class="buttons" style="margin-top:16px;">
        <button id="send-whatsapp" class="whatsapp">📱 ارسال به واتساپ</button>
        <button id="save-record">💾 ذخیره در سابقه مشتری</button>
        <button id="restart" class="secondary">شروع دوباره</button>
      </div>
    </section>
  </div>

  <!-- بخش سابقه -->
  <div id="tab-history" class="hidden">
    <section class="card">
      <h2>سابقه مشتریان</h2>
      <div id="history-list"></div>
      <button id="clear-history" class="secondary" style="margin-top:12px;">🗑 پاک کردن همه سابقه</button>
    </section>
  </div>
</main>

<footer>
  <p>طراح: <strong>محمد سیستانی</strong></p>
</footer>

<script>
// ==================== کاتالوگ محصولات ====================
const productsData = {
  acne: {
    title: "آکنه و جوش",
    products: [
      { brand: "MND", name: "ژل ضدآکنه (مناسب پوست چرب)" },
      { brand: "MND", name: "کرم ضدآکنه (مناسب پوست خشک و معمولی)" },
      { brand: "MND", name: "فوم شستشوی صورت پوست چرب" },
      { brand: "MND", name: "ژل شستشوی صورت پوست چرب" },
      { brand: "MND", name: "ماسک صورت حاوی پودر زغال" },
      { brand: "Blackberry", name: "سرم کنترل چربی (نیاسینامید ۱۰٪ + زینک)" }
    ]
  },
  spots: {
    title: "لک و تیرگی",
    products: [
      { brand: "Blackberry", name: "سرم روشن‌کننده (آلفا آربوتین ۲٪)" },
      { brand: "MND", name: "کرم ضدلک" },
      { brand: "MND", name: "ماسک روشن‌کننده حاوی خاک‌رس" },
      { brand: "MND", name: "کرم روشن‌کننده بدن" },
      { brand: "MND", name: "کرم روشن‌کننده زیر بغل و کشاله ران" },
      { brand: "MND", name: "اسکراب روشن‌کننده صورت" }
    ]
  },
  wrinkles: {
    title: "چین و چروک",
    products: [
      { brand: "Blackberry", name: "سرم ضدچروک (حاوی ذرات طلا ۲۴ عیار)" },
      { brand: "Blackberry", name: "سرم ضدچروک (ویتامین C ۱۲٪)" },
      { brand: "Blackberry", name: "کرم ضدچروک صورت" },
      { brand: "Blackberry", name: "کرم مناسب دور چشم" },
      { brand: "Blackberry", name: "کرم فوق آبرسان و جوانساز طلا ۲۴ عیار" },
      { brand: "MND", name: "کرم سفت‌کننده روز (SPF 15)" },
      { brand: "MND", name: "کرم سفت‌کننده شب" }
    ]
  },
  oily: {
    title: "چربی و منافذ باز",
    products: [
      { brand: "Blackberry", name: "سرم کنترل چربی (نیاسینامید ۱۰٪ + زینک)" },
      { brand: "MND", name: "ژل شستشوی صورت پوست چرب" },
      { brand: "MND", name: "فوم شستشوی صورت پوست چرب" },
      { brand: "MND", name: "تونر متعادل‌کننده سبوم" },
      { brand: "MND", name: "محلول پاک‌کننده اتانولی (پوست چرب)" },
      { brand: "MND", name: "ماسک کاهش‌دهنده سبوم" },
      { brand: "MND", name: "کرم‌ژل آبرسان (پوست چرب)" }
    ]
  },
  dry: {
    title: "خشکی و کم‌آبی",
    products: [
      { brand: "Blackberry", name: "سرم آبرسان و ترمیم‌کننده (هیالورونیک اسید ۲٪)" },
      { brand: "MND", name: "کرم آبرسان (پوست معمولی)" },
      { brand: "MND", name: "تونر آبرسان" },
      { brand: "MND", name: "بالم مرطوب‌کننده" },
      { brand: "MND", name: "روغن نرم‌کننده پوست" },
      { brand: "MND", name: "کرم نرم‌کننده حاوی ۵٪ اوره" }
    ]
  },
  hairLoss: {
    title: "ریزش مو",
    products: [
      { brand: "Blackberry", name: "سرم تقویت‌کننده و ضدریزش مو" },
      { brand: "Blackberry", name: "لوسیون تقویت‌کننده ابرو" },
      { brand: "Blackberry", name: "سرم تقویت مژه" },
      { brand: "MND", name: "شامپو تقویت‌کننده مو" },
      { brand: "MND", name: "تونیک تقویت‌کننده مو" },
      { brand: "MND", name: "شامپو جینسینگ" }
    ]
  },
  dandruff: {
    title: "شوره سر",
    products: [
      { brand: "MND", name: "شامپو ضدشوره" },
      { brand: "MND", name: "تونیک ضدشوره" },
      { brand: "MND", name: "شامپو پوست سر چرب" }
    ]
  },
  supplements: {
    title: "مکمل‌های پیشنهادی",
    products: [
      { brand: "Ellen Beauty", name: "پودر کلاژن خوراکی" },
      { brand: "Ellen Beauty", name: "کپسول کلاژن" },
      { brand: "Ellen Beauty", name: "نوشیدنی فراسودمند انرژی‌زا (پپتوییت)" }
    ]
  }
};

// ==================== ناوبری تب‌ها ====================
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.getElementById('tab-scan').classList.toggle('hidden', target !== 'scan');
    document.getElementById('tab-history').classList.toggle('hidden', target !== 'history');
    if (target === 'history') renderHistory();
  };
});

// ==================== ناوبری مراحل ====================
let stream = null;
let currentFacing = 'user';
let lastResult = null;

const formSection = document.getElementById('form-section');
const cameraSection = document.getElementById('camera-section');
const resultSection = document.getElementById('result-section');

document.getElementById('next-to-camera').onclick = () => {
  const area = document.getElementById('scan-area').value;
  const label = area === 'face' ? 'صورت' : 'مو و کف سر';
  document.getElementById('scan-area-label').textContent = label;
  document.getElementById('camera-hint').textContent = area === 'face'
    ? 'صورت خود را در نور مناسب و بدون آرایش مقابل دوربین قرار دهید.'
    : 'برای اسکن مو، از دوربین پشت استفاده کنید و کف سر را در نور مناسب قرار دهید.';
  // برای مو، دوربین پشت پیش‌فرض
  currentFacing = area === 'face' ? 'user' : 'environment';
  formSection.classList.add('hidden');
  cameraSection.classList.remove('hidden');
  startCamera();
};

document.getElementById('restart').onclick = () => {
  resultSection.classList.add('hidden');
  formSection.classList.remove('hidden');
  document.getElementById('retake').classList.add('hidden');
  document.getElementById('capture').classList.remove('hidden');
};

document.getElementById('retake').onclick = () => {
  resultSection.classList.add('hidden');
  cameraSection.classList.remove('hidden');
  document.getElementById('retake').classList.add('hidden');
  document.getElementById('capture').classList.remove('hidden');
  startCamera();
};

// ==================== دوربین ====================
async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacing, width: { ideal: 720 }, height: { ideal: 960 } }
    });
    document.getElementById('video').srcObject = stream;
  } catch (e) {
    if (currentFacing === 'environment') {
      currentFacing = 'user';
      return startCamera();
    }
    alert('دسترسی به دوربین ممکن نشد. لطفاً اجازه دسترسی بدهید.');
    console.error(e);
  }
}

document.getElementById('switch-camera').onclick = () => {
  currentFacing = currentFacing === 'user' ? 'environment' : 'user';
  startCamera();
};

// ==================== تحلیل تصویر ====================
document.getElementById('capture').onclick = async () => {
  const video = document.getElementById('video');
  if (!video.videoWidth) {
    alert('دوربین آماده نیست. کمی صبر کنید.');
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  if (stream) stream.getTracks().forEach(t => t.stop());

  const scanArea = document.getElementById('scan-area').value;
  const issues = analyzeImage(canvas, scanArea);
  const products = buildProducts(issues);
  lastResult = { issues, products, scanArea };

  showResults(issues, products);

  cameraSection.classList.add('hidden');
  resultSection.classList.remove('hidden');
};

function analyzeImage(canvas, scanArea) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;

  // تحلیل ناحیه‌ای صورت
  const regions = {
    forehead: { x0: 0.3, x1: 0.7, y0: 0.10, y1: 0.25 },
    eyes:     { x0: 0.2, x1: 0.8, y0: 0.30, y1: 0.45 },
    nose:     { x0: 0.35, x1: 0.65, y0: 0.40, y1: 0.55 },
    cheeks:   { x0: 0.15, x1: 0.85, y0: 0.45, y1: 0.65 },
    chin:     { x0: 0.35, x1: 0.65, y0: 0.65, y1: 0.85 }
  };

  function regionStats(r) {
    const x0 = Math.floor(w * r.x0), x1 = Math.floor(w * r.x1);
    const y0 = Math.floor(h * r.y0), y1 = Math.floor(h * r.y1);
    let count = 0, red = 0, shine = 0, dark = 0, edge = 0, prev = -1;
    let sumR = 0, sumG = 0, sumB = 0;
    for (let y = y0; y < y1; y += 4) {
      for (let x = x0; x < x1; x += 4) {
        const i = (y * w + x) * 4;
        const R = d[i], G = d[i+1], B = d[i+2];
        sumR += R; sumG += G; sumB += B;
        count++;
        if (R > 140 && (R - G) > 35 && (R - B) > 25) red++;
        const lum = 0.299*R + 0.587*G + 0.114*B;
        if (lum > 200) shine++;
        if (lum < 90) dark++;
        if (prev >= 0 && Math.abs(lum - prev) > 30) edge++;
        prev = lum;
      }
    }
    return {
      redness: red / count,
      shine: shine / count,
      darkness: dark / count,
      texture: edge / count,
      avgR: sumR / count
    };
  }

  const stats = {};
  for (const k in regions) stats[k] = regionStats(regions[k]);

  // میانگین کل
  const total = { redness: 0, shine: 0, darkness: 0, texture: 0, avgR: 0 };
  Object.values(stats).forEach(s => {
    total.redness += s.redness;
    total.shine += s.shine;
    total.darkness += s.darkness;
    total.texture += s.texture;
    total.avgR += s.avgR;
  });
  const n = Object.keys(stats).length;
  total.redness /= n; total.shine /= n; total.darkness /= n;
  total.texture /= n; total.avgR /= n;

  const issues = [];

  if (scanArea === 'scalp') {
    // تحلیل مو
    if (total.shine > 0.20) {
      issues.push({
        key: 'dandruff', title: 'احتمال شوره یا چربی کف سر',
        severity: total.shine > 0.30 ? 'high' : 'medium',
        desc: 'براقیت و ترشح چربی در ناحیه کف سر مشاهده شد.'
      });
    }
    if (total.texture > 0.28 || total.darkness > 0.25) {
      issues.push({
        key: 'hairLoss', title: 'احتمال ضعیف شدن فولیکول مو',
        severity: total.texture > 0.35 ? 'high' : 'medium',
        desc: 'کاهش تراکم و ناهمواری در ناحیه مو مشاهده شد.'
      });
    }
    if (issues.length === 0) {
      issues.push({
        key: 'hairLoss', title: 'مو و کف سر سالم',
        severity: 'low',
        desc: 'مشکل حادی مشاهده نشد. مراقبت روزانه توصیه می‌شود.'
      });
    }
  } else {
    // تحلیل صورت با اولویت ناحیه
    if (stats.forehead.texture > 0.28 || stats.eyes.texture > 0.28) {
      issues.push({
        key: 'wrinkles', title: 'احتمال چین و چروک',
        severity: stats.forehead.texture > 0.35 ? 'high' : 'medium',
        desc: 'خطوط در ناحیه پیشانی و اطراف چشم مشاهده شد.'
      });
    }
    if (stats.cheeks.darkness > 0.20 || stats.forehead.darkness > 0.20) {
      issues.push({
        key: 'spots', title: 'احتمال لک و تیرگی',
        severity: stats.cheeks.darkness > 0.30 ? 'high' : 'medium',
        desc: 'تیرگی در ناحیه گونه‌ها و پیشانی مشاهده شد.'
      });
    }
    if (stats.nose.shine > 0.22 || stats.forehead.shine > 0.22) {
      issues.push({
        key: 'oily', title: 'احتمال پوست چرب و منافذ باز',
        severity: stats.nose.shine > 0.32 ? 'high' : 'medium',
        desc: 'براقیت در ناحیه بینی و پیشانی مشاهده شد.'
      });
    }
    if (stats.cheeks.redness > 0.15 || stats.chin.redness > 0.15) {
      issues.push({
        key: 'acne', title: 'احتمال آکنه و التهاب',
        severity: stats.cheeks.redness > 0.25 ? 'high' : 'medium',
        desc: 'قرمزی و التهاب در ناحیه گونه‌ها یا چانه مشاهده شد.'
      });
    }
    if (total.avgR < 120) {
      issues.push({
        key: 'dry', title: 'احتمال خشکی و کم‌آبی',
        severity: total.avgR < 100 ? 'high' : 'medium',
        desc: 'کاهش رطوبت و روشنایی پوست مشاهده شد.'
      });
    }
    if (issues.length === 0) {
      issues.push({
        key: 'dry', title: 'پوست سالم و متعادل',
        severity: 'low',
        desc: 'مشکل خاصی مشاهده نشد. مراقبت روزانه توصیه می‌شود.'
      });
    }
  }

  return issues;
}

function buildProducts(issues) {
  const productSet = new Map();
  issues.forEach(issue => {
    if (productsData[issue.key]) {
      productsData[issue.key].products.forEach(p => {
        productSet.set(p.brand + '|' + p.name, p);
      });
    }
  });
  const age = parseInt(document.getElementById('age').value) || 30;
  if (age > 35) {
    productsData.supplements.products.forEach(p => {
      productSet.set(p.brand + '|' + p.name, p);
    });
  }
  return Array.from(productSet.values());
}

// ==================== نمایش نتیجه ====================
function showResults(issues, products) {
  const issuesList = document.getElementById('issues-list');
  const productsList = document.getElementById('products-list');
  issuesList.innerHTML = '';
  productsList.innerHTML = '';

  const sevMap = { low: 'کم', medium: 'متوسط', high: 'زیاد' };

  issues.forEach(issue => {
    const div = document.createElement('div');
    div.className = 'issue-item';
    div.innerHTML = `
      <h4><span class="severity ${issue.severity}">${sevMap[issue.severity]}</span> ${issue.title}</h4>
      <p>${issue.desc}</p>
    `;
    issuesList.appendChild(div);
  });

  products.forEach(p => {
    const div = document.createElement('div');
    div.className = 'product-item';
    div.innerHTML = `<span class="brand">${p.brand}</span><span class="name">${p.name}</span>`;
    productsList.appendChild(div);
  });
}

// ==================== ارسال به واتساپ ====================
document.getElementById('send-whatsapp').onclick = () => {
  if (!lastResult) return;
  const name = document.getElementById('customer-name').value || 'مشتری';
  const age = document.getElementById('age').value || '-';
  const scanArea = lastResult.scanArea === 'face' ? 'صورت' : 'مو و کف سر';

  let text = `🌿 گزارش پوست‌یار\n`;
  text += `👤 نام: ${name}\n`;
  text += `🎂 سن: ${age}\n`;
  text += `🔍 ناحیه اسکن: ${scanArea}\n\n`;
  text += `📋 عوارض شناسایی‌شده:\n`;
  lastResult.issues.forEach(i => {
    text += `• ${i.title}\n`;
  });
  text += `\n💡 محصولات پیشنهادی:\n`;
  lastResult.products.forEach(p => {
    text += `• [${p.brand}] ${p.name}\n`;
  });
  text += `\n---\nطراح: محمد سیستانی`;

  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
};

// ==================== ذخیره سابقه ====================
document.getElementById('save-record').onclick = () => {
  if (!lastResult) return;
  const records = JSON.parse(localStorage.getItem('poostyar_records') || '[]');
  const record = {
    id: Date.now(),
    date: new Date().toLocaleString('fa-IR'),
    name: document.getElementById('customer-name').value || 'بدون نام',
    age: document.getElementById('age').value || '-',
    scanArea: lastResult.scanArea,
    issues: lastResult.issues,
    products: lastResult.products
  };
  records.unshift(record);
  localStorage.setItem('poostyar_records', JSON.stringify(records));
  alert('✅ در سابقه ذخیره شد');
};

function renderHistory() {
  const list = document.getElementById('history-list');
  const records = JSON.parse(localStorage.getItem('poostyar_records') || '[]');
  if (records.length === 0) {
    list.innerHTML = '<div class="empty-state">هنوز سابقه‌ای ثبت نشده است.</div>';
    return;
  }
  list.innerHTML = '';
  records.forEach(r => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="date">${r.date}</div>
      <div class="name">${r.name} (${r.age} ساله)</div>
      <div class="summary">
        ${r.issues.map(i => '• ' + i.title).join('<br>')}
      </div>
    `;
    list.appendChild(div);
  });
}

document.getElementById('clear-history').onclick = () => {
  if (confirm('همه سابقه پاک شود؟')) {
    localStorage.removeItem('poostyar_records');
    renderHistory();
  }
};
</script>
